[project]
name = "forge"
version = "0.1.0"
description = "Multi-agent pipeline that takes a requirement to a reviewed code change, with people approving merge and deploy."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Tools Forge runs against target repositories
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.7",
    "defusedxml>=0.7.1",
]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 110
extend-exclude = ["samples", "eval/hidden", "web", ".forge"]
